[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-presentation-cli"
version = "0.3.3"
description = "Web Presentation CLI - 面向 AI 演示文稿创作平台的命令行与 Agent 工具包"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/LLMxPM/web-presentation-cli"
Repository = "https://github.com/LLMxPM/web-presentation-cli"
Issues = "https://github.com/LLMxPM/web-presentation-cli/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
wp = "wp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wp"]

[tool.hatch.build.targets.sdist.force-include]
"../api-client/src/wp_api_client" = "src/wp_api_client"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
